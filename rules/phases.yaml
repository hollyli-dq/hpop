# PDAF v3.0 — Layer A phase taxonomy.
# The 9 cognitive phases ARE HPOP's skill-type vocabulary R (Report 3 §2.2).
# Each canonical action token (CPA) maps to exactly one phase. Phases recur within a trace.
# Source of truth for the schema enum: src/hpop/annotate/schema.py (PHASES).

phases:
  - id: PLAN
    l_level: L1            # goal-setting
    cognitive_state: "Goal decomposition — PFC sets goal hierarchy"
    reference: "Miller & Cohen (2001); Grosz & Sidner (1986)"
    cpas: [FORMULATE_GOAL]
  - id: RETRIEVE
    l_level: L2            # execution
    cognitive_state: "Directed subgoal pursuit — externally-directed acquisition"
    reference: "Botvinick et al. (2009)"
    cpas: [SEARCH_SOURCE, OPEN_DOCUMENT, NAVIGATE_PAGE]
  - id: INSPECT
    l_level: L2
    cognitive_state: "Metacognitive monitoring — passive scanning, no proposition tested"
    reference: "Nelson & Narens (1990)"
    cpas: [READ_SOURCE, SCAN_RESULTS]
  - id: EXTRACT
    l_level: L2
    cognitive_state: "Focused subgoal pursuit — central executive locks on target"
    reference: "Baddeley (2000)"
    cpas: [EXTRACT_EVIDENCE, FILL_FIELD]
  - id: VERIFY
    l_level: L2
    cognitive_state: "Metacognitive control — explicit proposition; output is a truth value"
    reference: "Nelson & Narens (1990); Wason (1960)"
    cpas: [VERIFY_CLAIM]
  - id: WRITE
    l_level: L2
    cognitive_state: "Generative production — externalization mode"
    reference: "Flower & Hayes (1981)"
    cpas: [WRITE_RESPONSE, SUBMIT_FORM]
  - id: SYNTHESIZE
    l_level: L3            # integration
    cognitive_state: "Multi-source integration — assembles a representation no single unit possessed"
    reference: "Hutchins (1995)"
    cpas: [SYNTHESIZE_FINDINGS]
  - id: REPAIR
    l_level: L4            # interrupt
    cognitive_state: "Error monitoring — SAS override after a failure signal"
    reference: "Norman & Shallice (1986)"
    cpas: [REPAIR_SOURCE]
  - id: HANDOFF
    l_level: L4
    cognitive_state: "Distributed cognitive load transfer (agent identity change)"
    reference: "Hutchins (1995); Monsell (2003)"
    cpas: []
